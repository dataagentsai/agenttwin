[project]
name = "agenttwin"
version = "0.9.0"
description = "AgentTwin — twins the agent's world, not the agent. A world-description format and reference runner for Clean AI Engineering."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "mcp>=1.9",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx2>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "hypothesis>=6.100",
    "jsonschema>=4.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agenttwin"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
