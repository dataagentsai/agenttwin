[project]
name = "agenttwin"
version = "0.11.0"
description = "AgentTwin — twins the agent's world, not the agent. A world-description format and reference runner for Clean AI Engineering."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "mcp>=1.9",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx2>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "hypothesis>=6.100",
    "jsonschema>=4.20",
    "allpairspy>=2.5.1",
    "hypothesis-jsonschema>=0.23.1",
    "pyrit>=1.1.0",
]
pairwise = [
    "allpairspy>=2.5.1",
]
pyrit = [
    "pyrit>=1.1.0",
]
langwatch = [
    "langwatch-scenario>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agenttwin"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv]
# LangWatch Scenario pins older openai, huggingface-hub, websockets, filelock and
# tenacity than the rest of the lock uses. Resolved in its own fork, so adding
# the extra never moves a version anybody else gets (dev and the core included).
conflicts = [
    [{ extra = "langwatch" }, { extra = "dev" }],
    [{ extra = "langwatch" }, { extra = "pyrit" }],
]
